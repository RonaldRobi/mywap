org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# R8 full mode: pengoptimuman kod lebih agresif untuk build release
# (kurangkan saiz + memori). Disyorkan Play Console. Lalai true pada AGP 8+,
# ditetapkan eksplisit supaya tidak terjejas oleh perubahan lalai kelak.
android.enableR8.fullMode=true
